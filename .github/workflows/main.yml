
name: Lint Code

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install flake8

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              p for p in Path(".").rglob("*.py")
              if ".git" not in p.parts
              and ".venv" not in p.parts
              and "venv" not in p.parts
          ]

          for file in files:
              ast.parse(file.read_text(encoding="utf-8"), filename=str(file))

          print(f"Python syntax OK: {len(files)} files")
          PY

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JSHint
        run: npm install --global jshint

      - name: Check JavaScript syntax
        run: |
          find ./server/database -name "*.js" -print
          node --check ./server/database/app.js
          node --check ./server/database/dealership.js
          node --check ./server/database/inventory.js
          node --check ./server/database/review.js
